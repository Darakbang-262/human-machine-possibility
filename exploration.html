function request(e,i){return JSON.stringify({type:'cybernetics-submission',unit:code(i),title:name(i),journal:e.journal,problems:e.problems,answers:e.answers,request:'일지 및 풀이를 검토해줘. 실제 오류, 미해결 사항과 설명 개선점을 확인해줘. 평가 JSON 형식: {"unit":"'+code(i)+'","status":"completed 또는 revision","score":0,"journal_passed":true,"problems_passed":true,"feedback":"피드백","connections":[{"from":"개념","to":"개념","type":"수학적/이론적/기술적/경험적/비유적","basis":"근거"}]}. 핵심 이론과 필수 문제가 통과한 경우만 완료.'},null,2)}
function importReview(raw,i){const x=JSON.parse(raw.trim().replace(/^```(?:json)?\s*|\s*```$/g,''));if(x.unit!==code(i)||!['completed','revision'].includes(x.status)||typeof x.feedback!=='string'||!Number.isFinite(x.score)||x.score<0||x.score>100)throw Error('단원 번호 또는 평가 형식 오류');const e=entry(i);if(x.status==='completed'&&(!e.submitted||!e.journal.theory?.trim()||!e.problems.trim()||!e.answers.trim()||x.journal_passed!==true||x.problems_passed!==true))throw Error('일지 제출·문제 풀이 및 두 항목 통과 확인이 필요합니다.');e.review={status:x.status,score:x.score,feedback:x.feedback,journal_passed:x.journal_passed===true,problems_passed:x.problems_passed===true,connections:Array.isArray(x.connections)?x.connections.filter(c=>c&&typeof c.from==='string'&&typeof c.to==='string'&&typeof c.basis==='string').map(c=>({from:c.from,to:c.to,basis:c.basis,type:String(c.type||'연결')})):[],at:new Date().toISOString()};save()}
function pane(){const i=data.selected,e=entry(i),p=$('pane');p.replaceChildren();if(tab==='개요'){p.append(el('div','MISSION BRIEFING','eyebrow'),el('p',goals[i]),el('p','예상 10시간 · 문제 3~5개 · 탐구 일지 1편','muted'),el('div','현재 상태: '+status(i),'notice'));p.append(btn('학습 요청 복사',()=>copy('로고스, '+code(i)+' '+name(i)+' 단원을 학습하자. 목표: '+goals[i]+' 학술적 정의, 수식, 성립 조건, 검증된 학문 간 연결 중심으로 설명해줘.')));return}if(tab==='탐구 일지'){p.append(el('p','자신의 언어로 작성하세요. 해당 없는 항목은 생략할 수 있습니다. 입력은 자동 저장됩니다.','muted'));for(const [k,l] of fields)field(p,l,e.journal[k],v=>edit(e,()=>e.journal[k]=v));const a=el('div',undefined,'actions');a.append(btn('검토용 일지 및 풀이 제출',()=>{if(!e.journal.theory?.trim()||!e.problems.trim()||!e.answers.trim())return toast('핵심 이론과 문제·풀이를 먼저 작성하세요.');e.submitted=true;save();render();modal('로고스에게 제출','복사하여 ChatGPT 채팅에 붙여넣으세요. 자동 전송되지 않습니다.',request(e,i),null)},'primary'));p.append(a);return}if(tab==='문제'){p.append(el('p','ChatGPT에서 받은 문제를 붙여넣고 풀이를 작성하세요.','muted'));field(p,'단원 문제',e.problems,v=>edit(e,()=>e.problems=v));field(p,'풀이 및 답안',e.answers,v=>edit(e,()=>e.answers=v));p.append(btn('문제 출제 요청 복사',()=>copy('로고스, '+code(i)+' '+name(i)+'에서 학습한 내용을 검증하는 문제 3~5개를 출제해줘. 필수와 선택 도전을 구분하고 정답은 아직 제공하지 마.')));return}if(tab==='연결 기록'){p.append(el('p','완료 평가에 등록된 학문 간 연결을 전체 항로에서 확인합니다.','muted'));let found=0;for(const j of all){const v=entry(j);if(v.review?.status!=='completed')continue;for(const c of v.review.connections||[]){found++;p.append(el('small',code(j)+' · '+(c.type||'연결')),el('h3',c.from+' ↔ '+c.to),el('p',c.basis,'record'))}}if(!found)p.append(el('div','아직 검토 완료된 연결이 없습니다.','notice'));return}p.append(el('p','ChatGPT의 평가 결과 JSON을 가져옵니다. 이 결과는 자동 인증이 아닌 수동 기록입니다.','muted'),btn('평가 JSON 가져오기',()=>modal('평가 등록','해당 단원에 대한 평가 JSON을 붙여넣으세요.','',v=>importReview(v,i)),'primary'));if(!e.review){p.append(el('div','검토 기록 없음','notice'));return}p.append(el('h3',status(i)+' · '+e.review.score+'점'),el('div',e.review.feedback,'record'));for(const c of e.review.connections||[]){p.append(el('h3',c.from+' ↔ '+c.to),el('p',(c.type||'연결')+' · '+c.basis,'record'))}}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('복사됨')}catch(e){modal('복사','아래 내용을 직접 복사하세요.',t,null)}}function download(t,n){const u=URL.createObjectURL(new Blob([t],{type:'application/json'}));const a=el('a');a.href=u;a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('mc').onclick=async()=>{try{await navigator.clipboard.writeText($('mv').value);toast('복사됨')}catch(e){$('mv').select();toast('텍스트를 직접 복사하세요.')}};$('md').onclick=()=>download($('mv').value,'cybernetics-'+code(data.selected)+'.json');$('mx').onclick=()=>$('modal').close();$('resume').onclick=()=>{const i=data.selected,e=entry(i);modal('항해 재개 데이터','새 대화에 복사해 학습 위치를 전달하세요.',JSON.stringify({course:'사이버네틱스',current:code(i),title:name(i),goal:goals[i],completed:all.filter(j=>entry(j).review?.status==='completed').map(code),current_record:e},null,2),null)};$('backup').onclick=()=>download(JSON.stringify(data,null,2),'cybernetics-backup.json');$('restore').onclick=()=>$('file').click();$('file').onchange=async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{const x=validate(JSON.parse(await f.text()));if(!confirm('현재 기록을 백업 내용으로 교체할까요?'))return;data=x;save();render();toast('복원 완료')}catch(e){alert(e.message)}};$('full').onclick=()=>{document.body.classList.toggle('full');$('full').textContent=document.body.classList.contains('full')?'기본보기':'전체보기'};$('next').onclick=()=>{let n=all.find(i=>entry(i).review?.status!=='completed');if(n===undefined)toast('전체 항로 탐사 완료');else select(n)};render();
})();</script></body></html>
