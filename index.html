/* Cloud storage observatory */
.storage-trigger{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-color:#344d68;background:#14243a;color:#dce8f7;white-space:nowrap}
.storage-trigger>span:first-child{font-size:15px;color:#a9d8e7}
.storage-trigger .storage-percent{font-size:11px;color:#efc58e;font-variant-numeric:tabular-nums}
.storage-trigger:disabled{opacity:.7}
.storage-dialog{width:min(580px,calc(100vw - 28px));max-width:580px;max-height:calc(100dvh - 28px);overflow:auto;padding:0;border:1px solid #344b69;border-radius:18px;background:linear-gradient(165deg,#111f34,#0b1423 72%);color:var(--text);box-shadow:0 28px 90px #000b}
.storage-dialog::backdrop{background:#030711d9;backdrop-filter:blur(5px)}
.storage-dialog-inner{padding:clamp(18px,4vw,28px)}
.storage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px}
.storage-head h2{font-size:25px;line-height:1.3;letter-spacing:-.045em;margin:0 0 5px}
.storage-head p:not(.eyebrow){font-size:12px;color:var(--muted);margin:0}
.storage-head .eyebrow{margin-bottom:7px;color:#a9d8e7}
.storage-total{padding:19px;border:1px solid #2c405d;border-radius:14px;background:linear-gradient(135deg,#162840,#101b2e);margin-bottom:14px}
.storage-total-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.storage-total-line span{font-size:12px;color:var(--muted)}
.storage-total-line strong{font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.storage-total-line small{font-size:13px;color:var(--muted);font-weight:400}
.storage-bar{height:11px;border-radius:999px;background:#26364e;overflow:hidden;margin:14px 0 9px}
.storage-bar span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#73c7e0,#a9d8e7 58%,#efc58e);transition:width .25s ease}
.storage-bar span.warning{background:linear-gradient(90deg,#e8b66e,#e78e75)}
.storage-total-foot{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}
.storage-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.storage-stat{min-width:0;padding:14px;border:1px solid #293b55;border-radius:12px;background:#111d30}
.storage-stat span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.storage-stat strong{display:block;font-size:17px;font-weight:600;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.storage-filecount{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-top:1px solid #26374f;border-bottom:1px solid #26374f;font-size:12px;color:var(--muted)}
.storage-alert{margin:14px 0;padding:11px 13px;border:1px solid #72553a;border-radius:10px;background:#302619;color:#f0d4a8;font-size:12px;line-height:1.6}
.storage-alert.critical{border-color:#78464a;background:#321d25;color:#f2b8b5}
.storage-note{font-size:11px;line-height:1.75;color:#9baec8;margin:14px 0 0}
.storage-error{padding:15px;border:1px solid #70464b;border-radius:11px;background:#2c1d28;color:#efc1c0;font-size:13px;line-height:1.7;margin:14px 0}
.storage-loading{padding:25px 12px;text-align:center;color:var(--muted);font-size:13px}
.storage-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:17px}
@media(max-width:650px){.storage-trigger{gap:4px;padding:4px 7px}.storage-trigger .storage-label{display:none}.storage-trigger .storage-percent{font-size:10px}.storage-stats{grid-template-columns:1fr 1fr}.storage-head h2{font-size:22px}.storage-total{padding:15px}.storage-total-line strong{font-size:23px}}

function dataUrlBytes(data){const i=String(data||'').indexOf(',');if(i<0)return 0;const b=String(data).slice(i+1);return Math.max(0,Math.floor(b.length*3/4)-(b.endsWith('==')?2:b.endsWith('=')?1:0))}
async function optimizeStudyImage(file){const original=await fileData(file);if(!['image/jpeg','image/png'].includes(file.type)||file.size<700*1024)return {data:original,optimized:false};try{const img=new Image();img.src=original;await img.decode();if(!img.naturalWidth||!img.naturalHeight)return {data:original,optimized:false};const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;const ctx=canvas.getContext('2d',{alpha:file.type==='image/png'});if(!ctx)return {data:original,optimized:false};if(file.type==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}ctx.drawImage(img,0,0);const blob=await new Promise(resolve=>canvas.toBlob(resolve,file.type,file.type==='image/jpeg'?0.96:undefined));if(!blob||blob.size>file.size*0.95)return {data:original,optimized:false};return {data:await fileData(blob),optimized:true}}catch(error){console.warn('이미지 최적화를 건너뜁니다:',error);return {data:original,optimized:false}}}
function showImage(data){const d=document.createElement('dialog');d.className='image-viewer';const close=document.createElement('button');close.type='button';close.className='secondary';close.textContent='닫기';close.onclick=()=>d.close();const img=new Image();img.src=data;img.alt='첨부 이미지 확대';d.append(close,img);d.addEventListener('close',()=>d.remove());document.body.append(d);d.showModal()}
function notify(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3800)}
function markNav(){nav.innerHTML=[{id:'home',name:'연구실 홈',icon:'⌂'},...sections].map(s=>`<button data-go="${s.id}" class="${current===s.id?'active':''}" ${current===s.id?'aria-current="page"':''}><span class="symbol" aria-hidden="true">${s.icon}</span>${s.name}</button>`).join('');document.getElementById('crumb').textContent='개인 연구실 / '+(current==='home'?'홈':current==='settings'?'자료 관리':current==='edit'?'기록 작성':current==='read'?'기록 열람':getSection(current).name)}
function go(id){if(busy||(!owner&&id==='settings'))return;if(editDirty&&!confirm('작성 중인 변경 사항을 저장하지 않고 나갈까요?'))return;editDirty=false;current=id;document.getElementById('sidebar').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');markNav();if(id==='home')home();else if(id==='settings')settings();else section(id);visitorUI();window.scrollTo(0,0)}
const art=`<svg class="hero-art" viewBox="0 0 430 320" preserveAspectRatio="xMidYMid slice" fill="none" aria-hidden="true"><defs><pattern id="dots" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#78948c" opacity=".3"/></pattern></defs><path fill="url(#dots)" d="M0 0h430v320H0z"/><g stroke="#83a699" opacity=".6"><circle cx="260" cy="160" r="115" stroke-dasharray="2 8"/><circle cx="260" cy="160" r="92"/><circle cx="260" cy="160" r="70" stroke-dasharray="3 5"/><ellipse cx="260" cy="160" rx="49" ry="132" transform="rotate(48 260 160)"/><ellipse cx="260" cy="160" rx="49" ry="132" transform="rotate(-48 260 160)"/><path d="M260 26v268M126 160h268" stroke-dasharray="2 7"/><path d="M143 56l33 48m163 108 33 48M90 160H30m364 0h36"/></g><g fill="#b7cfc0"><circle cx="260" cy="160" r="6"/><circle cx="176" cy="104" r="4"/><circle cx="339" cy="212" r="4"/><circle cx="260" cy="68" r="3"/><circle cx="352" cy="160" r="3"/><circle cx="214" cy="229" r="3"/></g><circle cx="260" cy="160" r="17" stroke="#d9bd91" opacity=".7"/></svg>`;
function sorted(a){return [...a].sort((x,y)=>y.updated.localeCompare(x.updated))}
function listHTML(a){return a.map(e=>`<button class="entry" data-read="${safe(e.id)}"><span class="tag">${safe(e.status)}</span><div class="content"><strong>${safe(e.title)}</strong><div class="meta">${getSection(e.section).name} · ${dateText(e.updated)}${e.tags?' · '+safe(e.tags):''}${e.images?.length?' · 사진 '+e.images.length+'장':''} · ${e.visibility==='public'?'공개':'비공개'}</div></div><span aria-hidden="true" style="color:var(--muted)">→</span></button>`).join('')}
function empty(text,section='research'){if(!owner)return '<div class="empty">공개된 연구 기록이 아직 없습니다.</div>';return `<div class="empty"><strong>${safe(text)}</strong>아직 비어 있어도 괜찮습니다. 작은 질문 하나에서 시작하세요.<br><button class="secondary" data-new="${section}">＋ 첫 기록 작성</button></div>`}
function home(){lastList='home';app.innerHTML=`<section class="hero"><div class="hero-copy"><p class="eyebrow">INDEPENDENT RESEARCH SPACE</p><h1>인간과 기계,<br>그리고 가능성.</h1><p>질문에서 시작해, 이해를 넘어 가능성으로.</p><button class="primary" data-new="research">＋ 새로운 연구 기록</button></div><span class="hero-caption">OBSERVATION DECK · 2026</span></section>${kuRoot()}<div class="metrics"><div class="metric"><span>전체 기록</span><strong>${entries.length}</strong></div><div class="metric"><span>진행 중인 탐구</span><strong>${entries.filter(e=>e.status==='탐구 중').length}</strong></div><div class="metric"><span>완료한 기록</span><strong>${entries.filter(e=>e.status==='완료').length}</strong></div></div><div class="sectionhead"><h2>연구 공간</h2><span class="sub">여섯 개의 탐구 영역</span></div><div class="tiles">${sections.map(s=>`<button class="tile" data-go="${s.id}"><span class="tileicon" aria-hidden="true">${s.icon}</span><strong>${s.name}</strong><small>${s.desc}</small><span class="bottom"><span>${entries.filter(e=>e.section===s.id).length}개의 기록</span><span aria-hidden="true">↗</span></span></button>`).join('')}</div><div class="sectionhead"><h2>최근 연구 기록</h2><button class="secondary" data-go="research">연구 노트 보기</button></div><div class="entrylist">${entries.length?listHTML(sorted(entries).slice(0,5)):empty('아직 작성된 기록이 없습니다.')}</div><div class="foot">인간과 기계, 그리고 가능성 · 개인 연구실<br>공개 연구 기록은 누구나 읽을 수 있습니다. 비공개 기록은 관리자만 열람할 수 있습니다.</div>`;kuMount()}
function section(id){const s=getSection(id);lastList=id;app.innerHTML=`<div class="pagehead"><p class="eyebrow">RESEARCH SPACE / ${String(sections.indexOf(s)+1).padStart(2,'0')}</p><h1>${s.name}</h1><p>${s.desc}</p></div>${thShell(id)}<div class="toolbar"><input id="q" class="search" aria-label="기록 검색" placeholder="제목, 내용, 태그 검색…"><select id="filter" aria-label="진행 상태"><option value="">모든 상태</option><option>미완성</option><option>탐구 중</option><option>완료</option></select><button class="primary" data-new="${s.id}">＋ 새 기록</button></div><div class="sectionhead"><h2>기록 목록</h2><span class="sub" id="count"></span></div><div class="entrylist" id="list"></div>`;const update=()=>{let q=document.getElementById('q').value.toLocaleLowerCase().trim(),f=document.getElementById('filter').value;let a=sorted(entries.filter(e=>e.section===id&&(!f||e.status===f)&&(!q||[e.title,e.body,e.tags,e.reference].join(' ').toLocaleLowerCase().includes(q))));document.getElementById('count').textContent=a.length+'개의 기록';document.getElementById('list').innerHTML=a.length?listHTML(a):q||f?'<div class="empty">검색 조건에 맞는 기록이 없습니다.</div>':empty('아직 작성된 기록이 없습니다.',s.id)};document.getElementById('q').addEventListener('input',update);document.getElementById('filter').addEventListener('change',update);update();thMount(id)}
function editor(sectionId,id){if(busy||!owner)return;let e=id?entries.find(x=>x.id===id):null;if(id&&!e)return;current='edit';editDirty=false;let images=[...(e?.images||[])],pending=false;markNav();app.innerHTML=`<div class="pagehead"><p class="eyebrow">LAB NOTE</p><h1>${e?'연구 기록 수정':'새로운 연구 기록'}</h1><p>정답이 아닌 질문에서 출발해도 좋습니다.</p></div><form id="editor" class="formpanel"><div class="formgrid"><div class="formrow"><label for="cat">연구 공간</label><select id="cat">${sections.map(s=>`<option value="${s.id}" ${(e?.section||sectionId)===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div><div class="formrow"><label for="stat">진행 상태</label><select id="stat">${['미완성','탐구 중','완료'].map(s=>`<option ${(e?.status||'미완성')===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="formrow"><label for="visibility">공개 범위</label><select id="visibility"><option value="private" ${e?.visibility!=='public'?'selected':''}>비공개 — 나만 열람</option><option value="public" ${e?.visibility==='public'?'selected':''}>공개 — 누구나 열람</option></select><p class="notice">공개를 선택하면 클라우드 연결 후 방문자에게 글과 첨부 사진이 공개됩니다.</p></div><div class="formrow"><label for="title">제목 (필수)</label><input id="title" required maxlength="300" value="${safe(e?.title)}" placeholder="어떤 질문을 탐구하고 있나요?"></div><div class="formrow"><label for="body">내용</label><textarea id="body" placeholder="질문 / 이해한 내용 / 실험 결과 / 다음 탐구 방향 등 자유롭게 작성하세요.">${safe(e?.body)}</textarea></div><div class="formrow"><label for="images">그림 및 사진 첨부</label><div class="attach-picker"><input id="images" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,image/avif" multiple><p class="notice">PNG, JPG, GIF, WebP, BMP, AVIF · 한 장 최대 12MB · 기록당 20장<br>문서·필기 우선 최적화: 해상도는 줄이지 않습니다. JPEG는 고화질 96%로, PNG는 무손실 재저장 결과가 5% 이상 작을 때만 최적화합니다. GIF·WebP·BMP·AVIF는 원본을 유지합니다.</p></div><div id="image-previews" class="attach-grid"></div><p id="image-note" class="notice" aria-live="polite"></p></div><div class="formrow"><label for="tags">태그 (쉼표로 구분)</label><input id="tags" value="${safe(e?.tags)}" placeholder="뇌-컴퓨터 인터페이스, 인공지능, 회로이론"></div><div class="formrow"><label for="ref">참고 자료 (링크 또는 서지 정보)</label><input id="ref" value="${safe(e?.reference)}" placeholder="논문 주소 또는 참고 문헌"></div><p class="notice">기록과 첨부 사진은 로그인한 연구실 계정에 저장됩니다. 공개 여부를 확인하세요.</p><div class="actions"><button type="button" class="secondary" data-go="${e?.section||lastList}">취소</button><button type="submit" class="primary">기록 저장</button></div></form>`;let form=document.getElementById('editor');kuEditor(e);const picker=document.getElementById('images'), previews=document.getElementById('image-previews'), note=document.getElementById('image-note'), submit=form.querySelector('[type=submit]');function preview(){previews.innerHTML=images.map((im,i)=>{const stored=dataUrlBytes(im.data),source=Number.isFinite(im.sourceSize)?im.sourceSize:stored,detail=source>stored+1024?`${formatStorageBytes(source)} → ${formatStorageBytes(stored)} · ${Math.round((1-stored/source)*100)}% 절약`: `${formatStorageBytes(stored)} · ${im.sourceSize?'원본 유지':'저장된 파일'}`;return `<div class="attach-card"><img src="${safe(im.data)}" alt="${safe(im.name)}"><div class="attach-name">${safe(im.name)}<small>${safe(detail)}</small></div><button type="button" class="secondary" data-remove-image="${i}">첨부 제거</button></div>`}).join('');const saved=images.reduce((n,im)=>n+(Number.isFinite(im.sourceSize)?Math.max(0,im.sourceSize-dataUrlBytes(im.data)):0),0);note.textContent=images.length+'장 첨부됨'+(saved>1024?' · 약 '+formatStorageBytes(saved)+' 절약':'')+' · 원본 해상도 유지';}preview();previews.addEventListener('click',ev=>{let b=ev.target.closest('[data-remove-image]');if(!b||pending||busy)return;images.splice(Number(b.dataset.removeImage),1);editDirty=true;preview()});picker.addEventListener('change',async()=>{if(pending||busy)return;const files=Array.from(picker.files);picker.value='';pending=true;busy=true;submit.disabled=true;picker.disabled=true;let errors=[];try{for(const file of files){if(images.length>=MAX_FILES){errors.push('기록당 최대 20장');break}if(!MIME.test(file.type)||file.size>MAX_BYTES||!file.size){errors.push(file.name+' (형식 또는 크기 제한)');continue}try{const result=await optimizeStudyImage(file);const img=new Image();img.src=result.data;await img.decode();images.push({name:file.name.slice(0,255),data:result.data,sourceSize:file.size});editDirty=true}catch{errors.push(file.name+' (읽기 또는 최적화 실패)')}}}finally{pending=false;busy=false;submit.disabled=false;picker.disabled=false;preview();if(errors.length)note.textContent+=' · 추가하지 못한 파일: '+errors.join(', ')}});form.addEventListener('input',()=>editDirty=true);form.addEventListener('change',()=>editDirty=true);form.addEventListener('submit',async ev=>{ev.preventDefault();if(pending||busy)return;let title=document.getElementById('title').value.trim();if(!title){notify('제목을 입력하세요.');return}let now=new Date().toISOString(),item={id:e?.id||uid(),section:document.getElementById('cat').value,status:document.getElementById('stat').value,title,body:document.getElementById('body').value,tags:document.getElementById('tags').value.trim(),reference:document.getElementById('ref').value.trim(),created:e?.created||now,updated:now,images:[...images],visibility:document.getElementById('visibility').value};let intended=kuEl('ku-assign-editor')?.value||null,canAssign=!!kuEl('ku-assign-editor')&&!!kuData;let next=entries.filter(x=>x.id!==item.id).concat(item);busy=true;submit.disabled=true;let ok=await persist(next);busy=false;submit.disabled=false;if(ok){editDirty=false;busy=true;let warning='';if(canAssign){try{if(KU_ELIGIBLE.has(item.section))err(await client.rpc('lab_u_assign',{p_record:item.id,p_body:intended}));await kuLoad();}catch(ex){console.error(ex);warning='기록은 저장했지만 천체 편입은 실패했습니다: '+(ex.message||'연결 오류')+' · 홈에서 다시 편입하세요.';await kuLoad();}}busy=false;read(item.id);notify(warning||'연구 기록을 저장했습니다.');}});window.scrollTo(0,0)}
function read(id){if(busy)return;let e=entries.find(x=>x.id===id);if(!e)return;current='read';markNav();let ref=safe(e.reference);if(/^https?:\/\/[^\s]+$/i.test(e.reference))ref=`<a href="${safe(e.reference)}" target="_blank" rel="noopener noreferrer">${ref}</a>`;app.innerHTML=`<div class="toolbar"><button class="secondary" data-go="${lastList}">← 목록으로</button></div><article class="readpanel"><div class="eyebrow">${getSection(e.section).name}</div><span class="tag">${safe(e.status)}</span> <span class="tag">${e.visibility==='public'?'공개':'비공개'}</span><h1>${safe(e.title)}</h1><div class="notice">작성 ${dateText(e.created)} · 수정 ${dateText(e.updated)}</div><div class="tags">${e.tags.split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag">${safe(t)}</span>`).join('')}</div><div class="body">${safe(e.body||'아직 내용이 없습니다.')}</div>${e.images?.length?`<section class="attach-read"><h2>첨부 그림 및 사진 · ${e.images.length}장</h2>${e.images.map((im,i)=>`<figure><img src="${safe(im.data)}" alt="${safe(im.name)}" data-view-image="${i}" tabindex="0" role="button" aria-label="${safe(im.name)} 확대"><figcaption>${safe(im.name)} <a href="${safe(im.data)}" download="${safe(im.name)}">원본 저장</a></figcaption></figure>`).join('')}</section>`:''}${e.reference?`<div class="ref"><strong>참고 자료</strong><br>${ref}</div>`:''}<div class="actions"><button class="danger" data-delete="${safe(id)}">삭제</button><button class="secondary" data-export-one="${safe(id)}">텍스트 저장</button><button class="primary" data-edit="${safe(id)}">수정</button></div></article>`;app.querySelectorAll('[data-view-image]').forEach(img=>{const view=()=>showImage(e.images[Number(img.dataset.viewImage)].data);img.onclick=view;img.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();view()}}});visitorUI();window.scrollTo(0,0)}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type}));let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function settings(){lastList='home';app.innerHTML=`<div class="pagehead"><p class="eyebrow">ARCHIVE MANAGEMENT</p><h1>자료 관리 및 백업</h1><p>연구실의 기록을 안전하게 보관합니다.</p></div><div class="settings"><article><h2>연구 기록 백업</h2><p>현재 ${entries.length}개의 기록과 첨부 사진을 하나의 JSON 파일로 내려받습니다. 다른 기기로 옮기거나 브라우저의 기록이 지워질 때 복구할 수 있습니다.</p><button class="primary" id="export">전체 기록 백업</button></article><article><h2>백업 복원</h2><p>이 사이트에서 내려받은 JSON 파일을 불러옵니다. 기존 기록을 유지하며 같은 식별자의 기록은 더 최근에 수정한 버전으로 통합합니다.</p><button class="secondary" id="restore">백업 파일 불러오기</button></article><article><h2>지식의 우주 백업</h2><p>천체 설정과 소속·수동 연결을 별도 JSON 파일로 보관합니다. 현재 버전에서는 자동 복원은 지원하지 않습니다.</p><button class="secondary" id="ku-backup">우주 정보 백업</button></article><article><h2>저장 방식 안내</h2><p>로그인한 관리자 계정의 자료가 클라우드에 저장됩니다. 공개한 자료만 방문자가 열람할 수 있습니다. 백업을 정기적으로 내려받으세요.</p><p>공개 자료는 다른 사람이 복사할 수 있으며 나중에 비공개로 변경해도 이미 복사된 자료는 회수할 수 없습니다.</p></article></div>`;document.getElementById('export').onclick=()=>download('research-lab-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:3,entries},null,2),'application/json');document.getElementById('restore').onclick=()=>document.getElementById('import').click();document.getElementById('ku-backup').onclick=()=>{if(kuData&&owner)download('knowledge-universe-backup.json',JSON.stringify({version:1,...kuData},null,2),'application/json');else notify('우주 정보를 먼저 동기화하세요.')}}
document.getElementById('import').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f||!owner)return;try{let obj=JSON.parse(await f.text());let imported=clean(obj.entries??obj).map(e=>({...e,visibility:'private'}));if(!confirm(`${imported.length}개의 기록을 비공개 상태로 기존 자료에 통합할까요?`))return;let m=new Map(entries.map(e=>[e.id,e]));imported.forEach(e=>{if(!m.has(e.id)||m.get(e.id).updated<e.updated)m.set(e.id,e)});if(busy)return;busy=true;let ok=await persist([...m.values()]);busy=false;if(ok){settings();notify('백업을 복원했습니다.')}}catch(e){notify('불러오지 못했습니다. 올바른 백업 파일인지 확인하세요.')}});

function storageFileCategory(item){const meta=item.metadata||{},mime=String(meta.mimetype||meta.contentType||'').toLowerCase(),name=String(item.name||''),ext=(name.split('.').pop()||'').toLowerCase();if(mime.startsWith('image/')||['png','jpg','jpeg','gif','webp','bmp','avif','heic','heif'].includes(ext))return 'image';if(mime==='application/pdf'||mime.includes('word')||mime.includes('excel')||mime.includes('powerpoint')||mime.startsWith('text/')||['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','csv','md','hwp','hwpx','odt','ods'].includes(ext))return 'document';return 'other'}
async function readStorageUsage(){if(!owner||!accountUser)throw Error('관리자 로그인 후 확인할 수 있습니다.');const totals={total:0,images:0,documents:0,other:0,files:0};const folders=[''],seen=new Set();while(folders.length){const folder=folders.shift();if(seen.has(folder))continue;seen.add(folder);let offset=0;for(;;){const rows=err(await client.storage.from(BUCKET).list(folder,{limit:100,offset,sortBy:{column:'name',order:'asc'}}))||[];for(const item of rows){if(item.id==null){if(item.name)folders.push(folder?`${folder}/${item.name}`:item.name);continue}const size=Number(item.metadata?.size);if(!Number.isFinite(size)||size<0)continue;totals.total+=size;totals.files++;const category=storageFileCategory(item);if(category==='image')totals.images+=size;else if(category==='document')totals.documents+=size;else totals.other+=size}if(rows.length<100)break;offset+=rows.length}}return totals}
function storageAlert(pct){const level=pct>=100?100:pct>=90?90:pct>=80?80:0;if(level>storageAlertLevel){if(level===100)notify('저장 공간 사용량이 표시 기준 100%에 도달했습니다. Supabase 사용량을 확인하세요.');else notify(`연구실 저장 공간 사용량이 ${level}%에 도달했습니다.`)}storageAlertLevel=level}
function renderStorageDialog(){if(!storageDialog?.open)return;const content=storageDialog.querySelector('#storage-dialog-content');if(!content)return;let body='';if(storageLoading){body='<div class="storage-loading">클라우드 저장 공간을 확인하고 있습니다…</div>'}else if(storageError){body=`<div class="storage-error">저장 공간을 확인하지 못했습니다.<br>${safe(storageError)}<br><span>Storage의 파일 목록 조회 권한(SELECT)과 네트워크 연결을 확인해 주세요.</span></div>`}else if(storageUsage){const pct=storagePercent(),bar=Math.max(0,Math.min(100,pct)),alert=pct>=100?'<div class="storage-alert critical">표시 기준을 초과했습니다. 실제 요금제 사용량은 Supabase 대시보드에서 확인해 주세요.</div>':pct>=90?'<div class="storage-alert">저장 공간이 90% 이상 사용되었습니다. 오래된 첨부 파일과 백업을 점검해 주세요.</div>':pct>=80?'<div class="storage-alert">저장 공간이 80% 이상 사용되었습니다. 남은 공간을 확인하며 업로드해 주세요.</div>':'';const checked=storageCheckedAt?new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'short'}).format(storageCheckedAt):'—';body=`<div class="storage-total"><div class="storage-total-line"><span>현재 사용량</span><strong>${formatStorageBytes(storageUsage.total)} <small>/ 1GB</small></strong></div><div class="storage-bar"><span class="${pct>=90?'warning':''}" style="width:${bar}%"></span></div><div class="storage-total-foot"><span>${pct.toFixed(2)}% 사용</span><span>${formatStorageBytes(Math.max(0,STORAGE_QUOTA_BYTES-storageUsage.total))} 남음 · 표시 기준</span></div></div>${alert}<div class="storage-stats"><div class="storage-stat"><span>사진 및 이미지</span><strong>${formatStorageBytes(storageUsage.images)}</strong></div><div class="storage-stat"><span>문서</span><strong>${formatStorageBytes(storageUsage.documents)}</strong></div><div class="storage-stat"><span>기타 파일</span><strong>${formatStorageBytes(storageUsage.other)}</strong></div></div><div class="storage-filecount"><span>저장된 파일</span><strong>${storageUsage.files.toLocaleString('ko-KR')}개</strong></div><p class="storage-note">마지막 확인: ${checked}<br>이 화면은 현재 연구실 프로젝트의 비공개 저장소 <b>${BUCKET}</b>만 집계합니다. Supabase Free 플랜의 파일 저장 공간은 조직 전체 1GB이며, 같은 조직의 다른 프로젝트 사용량은 이 화면에 포함되지 않습니다. 500MB는 데이터베이스 용량으로 파일 저장 공간과 별도입니다.</p>`}else{body='<div class="storage-loading">아직 사용량 정보가 없습니다.</div>'}content.innerHTML=`<div class="storage-head"><div><p class="eyebrow">CLOUD STORAGE · OBSERVATORY</p><h2>저장 공간 관리</h2><p>연구실에 쌓인 자료와 남은 공간을 확인합니다.</p></div><button class="secondary" id="storage-close" type="button">닫기</button></div>${body}<div class="storage-actions"><button class="secondary" id="storage-refresh" type="button" ${storageLoading?'disabled':''}>↻ 다시 확인</button></div>`;content.querySelector('#storage-close').onclick=()=>storageDialog?.close();content.querySelector('#storage-refresh').onclick=()=>refreshStorageUsage()}
async function refreshStorageUsage(){if(!owner||!client||!accountUser||storageLoading)return;storageLoading=true;storageError='';updateStorageButton();renderStorageDialog();try{storageUsage=await readStorageUsage();storageCheckedAt=new Date();storageError='';storageAlert(storagePercent())}catch(e){console.error('Storage usage:',e);storageError=e?.message||'파일 목록을 불러오지 못했습니다.'}finally{storageLoading=false;updateStorageButton();renderStorageDialog()}}
async function openStorageDialog(){if(!owner||!client){notify('관리자 로그인 후 사용할 수 있습니다.');return}if(storageDialog?.open)return;const d=document.createElement('dialog');d.className='storage-dialog';d.innerHTML='<div class="storage-dialog-inner" id="storage-dialog-content"></div>';document.body.append(d);storageDialog=d;d.addEventListener('close',()=>{d.remove();if(storageDialog===d)storageDialog=null});d.addEventListener('click',ev=>{if(ev.target===d)d.close()});d.showModal();renderStorageDialog();await refreshStorageUsage()}

async function loadAll(){const rows=[];for(let n=0;;n+=100){const a=err(await client.from('lab_records').select('*').order('id').range(n,n+99));rows.push(...a);if(a.length<100)break}const out=[];for(const r of rows){const images=[];for(const im of r.attachments||[]){const blob=err(await client.storage.from(BUCKET).download(im.path));const data=await fileData(new Blob([blob],{type:im.mime}));images.push({name:im.name,data,path:im.path})}const e=clean([{...r.payload,id:r.id,updated:r.updated_at,visibility:r.visibility,images}])[0];e.images.forEach((im,i)=>im.path=images[i].path);out.push(e)}return out}

async function init(){const cfg=window.LAB_CONFIG;if(!cfg||!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(cfg.url)||!cfg.key||cfg.key.startsWith('YOUR_')||!window.supabase){app.innerHTML='<div class="formpanel"><h1>연구실 연결 준비 중</h1><p>Supabase 프로젝트와 공개용 키를 config.js에 설정한 후 다시 열어 주세요. 지금은 인터넷 저장이 연결되어 있지 않습니다.</p></div>';setMode('서버 미설정');return}try{client=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});await setupSession()}catch(e){console.error(e);setMode('연결 실패');app.textContent='연구실 연결에 실패했습니다. 프로젝트 설정을 확인하세요.'}}
async function saveRecord(e,old){const attachments=[],uploaded=[];let saved=false;try{for(const im of e.images){let previous=old?.images?.find(i=>i.data===im.data&&i.path);let path=previous?.path;const mime=im.data.slice(5,im.data.indexOf(';'));if(!path){path=accountUser.id+'/'+crypto.randomUUID();const blob=await (await fetch(im.data)).blob();err(await client.storage.from(BUCKET).upload(path,blob,{contentType:mime,upsert:false,cacheControl:'0'}));uploaded.push(path)}attachments.push({name:im.name,path,mime})}const {images,visibility,id,updated,...payload}=e;const row={id,visibility:visibility==='public'?'public':'private',payload,attachments,updated_at:new Date().toISOString()};let result=old?err(await client.from('lab_records').update(row).eq('id',id).eq('updated_at',old.updated).select('id,updated_at')):err(await client.from('lab_records').insert(row).select('id,updated_at'));if(result.length!==1)throw Error('다른 기기에서 수정되었거나 삭제된 기록입니다.');saved=true;e.updated=result[0].updated_at;e.images.forEach((im,i)=>im.path=attachments[i].path);const paths=old?.images?.map(i=>i.path).filter(path=>path&&!attachments.some(a=>a.path===path))||[];if(paths.length)await client.storage.from(BUCKET).remove(paths);return e}catch(error){if(!saved&&uploaded.length)await client.storage.from(BUCKET).remove(uploaded);throw error}}
async function persist(next){if(!owner||!accountUser)return false;try{const old=new Map(entries.map(e=>[e.id,e]));for(const e of next){const prev=old.get(e.id);if(!prev||JSON.stringify(prev)!==JSON.stringify(e))await saveRecord(e,prev);old.delete(e.id)}for(const e of old.values()){const result=err(await client.from('lab_records').delete().eq('id',e.id).eq('updated_at',e.updated).select('id'));if(result.length!==1)throw Error('다른 기기에서 수정된 기록입니다.');const paths=e.images.map(im=>im.path).filter(Boolean);if(paths.length)await client.storage.from(BUCKET).remove(paths)}entries=next;await kuLoad();await refreshStorageUsage();setMode('클라우드 저장됨');return true}catch(e){console.error(e);notify('저장 실패 또는 일부 기록만 저장되었습니다. 다른 기기에서 수정했거나 저장 한도에 도달했을 수 있습니다. 작성 내용을 복사한 후 새로고침해 확인하세요.');return false}}

function kuOpen(html){if(!owner||!kuData||busy)return null;if(kuDialog?.open)kuDialog.close();const d=document.createElement('dialog');d.className='ku-dialog';d.innerHTML=html;document.body.append(d);kuDialog=d;d.addEventListener('close',()=>{d.remove();if(kuDialog===d)kuDialog=null});d.showModal();d.querySelector('[data-ku-close]')?.addEventListener('click',()=>{if(!busy)d.close()});return d;}
async function kuMutate(fn,args,{selected=null,dialog=null,rerender=true}={}){if(!owner||busy||!kuData)return false;busy=true;try{let value=err(await client.rpc(fn,args));if(selected==='result')kuSelected=value;else if(selected)kuSelected=selected;await kuLoad();if(!kuData)throw Error('변경 후 다시 불러오지 못했습니다. 동기화를 눌러 확인하세요.');if(dialog?.open)dialog.close();if(rerender&&kuEl('ku-root'))kuRender();notify('지식의 우주에 반영했습니다.');return true}catch(e){console.error(e);let msg=e?.message||'변경하지 못했습니다.';if(dialog?.open)dialog.querySelector('.ku-error').textContent=msg;else notify(msg);return false}finally{busy=false;}}
function kuBodyDialog(b=null,{parent=null,kind='star',galaxy=kuGalaxy,after=null}={}){let hue=b?.hue??Math.floor(Math.random()*360);let d=kuOpen(`<h2>${b?'천체 설정':'새로운 천체'}</h2><p>천체 이름·수용량·외형을 정하세요. 자료 ${b?b.birth:'3~5'}개부터 탄생합니다.</p><form><label>천체 이름</label><input name="title" maxlength="100" required value="${safe(b?.title||'')}" placeholder="예: 신호처리의 별"><label>소속 은하</label><select name="galaxy" ${b?'disabled':''}>${KU_NAMES.slice(0,kuData.unlocked).map((v,i)=>`<option value="${i+1}" ${(b?.galaxy||galaxy)===i+1?'selected':''}>${i+1} · ${v}</option>`).join('')}</select><label>최대 수용량 (3~150)</label><input type="number" name="capacity" min="${Math.max(3,b?kuCount(b.id):0)}" max="150" required value="${b?.capacity||15}"><label>탄생 기준</label><select name="birth">${[3,4,5].map(x=>`<option ${(b?.birth||3)===x?'selected':''}>${x}</option>`).join('')}</select><label>천체 외형</label><select name="kind">${Object.entries(KU_KINDS).map(([k,v])=>`<option value="${k}" ${(b?.kind||kind)===k?'selected':''}>${v}</option>`).join('')}</select><label>색상 (0~359)</label><input type="range" name="hue" min="0" max="359" value="${hue}" style="accent-color:hsl(${hue} 80% 65%)"><label><input type="checkbox" name="pub" ${b?.public_label?'checked':''}> 공개 자료가 탄생 기준을 충족할 때 천체 이름도 공개</label>${b?`<label><input type="checkbox" name="sealed" ${b.sealed?'checked':''}> 보존 상태 (새 자료 편입 중단)</label>`:''}<p class="ku-error" role="alert"></p><div class="ku-row"><button class="ku-primary" type="submit">저장</button><button type="button" data-ku-close>취소</button></div></form>`);if(!d)return;let f=d.querySelector('form');f.elements.hue.oninput=e=>e.target.style.accentColor=`hsl(${e.target.value} 80% 65%)`;f.onsubmit=async e=>{e.preventDefault();let a=f.elements,cap=+a.capacity.value,birth=+a.birth.value,g=b?.galaxy||+a.galaxy.value;if(birth>cap){d.querySelector('.ku-error').textContent='탄생 기준은 수용량보다 클 수 없습니다.';return;}let ok=await kuMutate('lab_u_body',{p_id:b?.id||null,p_title:a.title.value.trim(),p_galaxy:g,p_ca function kuAssignDialog(n){let existing=new Map(kuData.members.map(m=>[m.record_id,m.body_id]));let recs=entries.filter(r=>KU_ELIGIBLE.has(r.section));let d=kuOpen(`<h2>자료 편입 · ${safe(n.title)}</h2><p>기존 연구 자료를 이동하거나 편입하세요. 원본 글과 사진은 그대로 유지됩니다.</p><form><label>연구 자료</label><select name="record" required>${recs.map(r=>`<option value="${safe(r.id)}">${safe(r.title)}${existing.has(r.id)?' · '+safe(kuBody(existing.get(r.id))?.title||'편입됨'):''}</option>`).join('')}</select><div class="ku-row"><button type="submit" class="ku-primary" ${!recs.length?'disabled':''}>이 천체에 편입</button><button type="button" id="ku-unassign" ${!recs.length?'disabled':''}>편입 해제</button><button type="button" data-ku-close>닫기</button></div><p class="ku-error"></p></form>`);if(!d)return;let f=d.querySelector('form');f.onsubmit=e=>{e.preventDefault();kuMutate('lab_u_assign',{p_record:f.elements.record.value,p_body:n.id},{dialog:d})};d.querySelector('#ku-unassign').onclick=()=>{let id=f.elements.record.value;if(existing.get(id)!==n.id){d.querySelector('.ku-error').textContent='이 천체에 편입된 자료를 선택하세요.';return;}kuMutate('lab_u_assign',{p_record:id,p_body:null},{dialog:d});};}

choices(original);cat.addEventListener('change',()=>{row.hidden=!KU_ELIGIBLE.has(cat.value);sel.disabled=row.hidden});kuEl('ku-create-editor').onclick=()=>kuBodyDialog(null,{galaxy:kuData.unlocked,after:id=>{choices(id);editDirty=true}});}
function kuBuildScene(bodies){let stats=new Map(),edges=[];for(let b of bodies){let rec=kuRecords(b.id),count=kuCount(b.id),tags=kuTags(b.id);stats.set(b.id,{count,born:count>=b.birth,energy:Math.min(1,rec.reduce((s,a)=>s+a.body.length+450*(a.images?.length||0),0)/9000),tags});}for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){let a=bodies[i],b=bodies[j],as=stats.get(a.id),bs=stats.get(b.id);if(!as.born||!bs.born)continue;let manual=kuLink(a.id,b.id),parent=owner&&(a.parent===b.id||b.parent===a.id),auto=[...as.tags].some(t=>bs.tags.has(t));if(manual||parent||auto)edges.push([i,j,!!(manual||parent)]);}kuScene={bodies,stats,edges};}
function kuDrawStart(){const c=kuEl('ku-canvas'),ctx=c.getContext('2d');let w=0,h=0,points=[],drag=null,seed=43;const rand=()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296);const stars=Array.from({length:360},()=>[rand(),rand(),rand(),rand()]);let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let last=0;
function glow(x,y,r,hue,alpha){r=Math.max(1,r);let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`hsla(${hue},100%,78%,${alpha})`);g.addColorStop(.25,`hsla(${hue},95%,60%,${alpha*.55})`);g.addColorStop(1,`hsla(${hue},80%,35%,0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}function arc(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2)}function oval(x,y,rx,ry,a){ctx.beginPath();ctx.ellipse(x,y,rx,ry,a,0,Math.PI*2)}

function voyRender(){const el=document.getElementById('voyage-panel');if(!el||!owner)return;const today=voyKey(Date.now());if(!voyMonth)voyMonth=today.slice(0,7);if(!voySelected)voySelected=today;const map=new Map();for(const e of entries){const k=voyKey(e.created);if(!map.has(k))map.set(k,[]);map.get(k).push(e);}const daily=map.get(today)||[],chosen=map.get(voySelected)||[],monthEntries=entries.filter(e=>voyKey(e.created).startsWith(voyMonth));let days=Math.max(1,Math.floor((Date.parse(today)-Date.parse(voyageStart))/86400000)+1);const first=voyMonth+'-01',firstDate=new Date(first+'T00:00:00Z'),start=voyShift(first,-firstDate.getUTCDay());const counts=Array.from({length:42},(_,i)=>{const k=voyShift(start,i),a=map.get(k)||[];return {k,n:a.length,inside:k.startsWith(voyMonth)}});let old=entries.filter(e=>e.section==='journal'&&voyKey(e.created)<=voyShift(today,-30)).sort((a,b)=>Math.abs(Date.parse(voyKey(a.created))-Date.parse(voyShift(today,-30)))-Math.abs(Date.parse(voyKey(b.created))-Date.parse(voyShift(today,-30))))[0];const categories=sections.map(s=>({name:s.name,n:monthEntries.filter(e=>e.section===s.id).length}));el.innerHTML=`<div class="v5-head"><div><p class="eyebrow">VOYAGE LOG · 항해 ${days}일차</p><h2>항해 기록실</h2><p>달성해야 할 양은 없습니다. 당신이 남긴 발자취만 기록합니다.</p></div><div class="v5-orb voyage-orb" aria-hidden="true">✧</div></div><div class="v5-stats">${[['설립 이후',days+'일'],['기록을 남긴 날',map.size+'일'],['전체 연구 기록',entries.length+'개'],['연구 일지',entries.filter(e=>e.section==='journal').length+'편']].map(([a,b])=>`<div><span>${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="v5-inner"><p class="eyebrow">DAILY REPORT · ${today}</p><h3>오늘의 항해 보고서</h3><p>${daily.length?`오늘 ${daily.length}개의 새 기록과 ${daily.reduce((n,e)=>n+(e.images?.length||0),0)}장의 첨부 사진이 쌓였습니다.`:'오늘 새로 작성된 기록은 없습니다. 쉬어가는 시간도 여정의 일부입니다.'}</p>${daily.length?listHTML(sorted(daily).slice(0,4)):''}</div><div class="v5-calendar"><div class="v5-row"><h3>연구 달력 · ${voyMonth}</h3><div><button type="button function thRender(){const el=document.getElementById('thought-panel');if(!el||!owner||!thData)return;const d=thData,lv=d.level,lower=[0,10,25,45][lv-1],target=TH_TARGETS[lv-1],q=d.history.find(x=>x.id===thSelected),daily=d.history.find(x=>x.id===d.daily),hist=d.history.filter(x=>thFilter==='all'||(thFilter==='saved'&&x.bookmarked)||(thFilter==='open'&&!x.answers.length)||(thFilter==='answered'&&x.answers.length));const progress=target?Math.min(100,Math.max(0,100*(d.answered-lower)/(target-lower))):100;const questionHTML=q?`<div class="v5-question"><div class="v5-row"><span class="eyebrow">${q.id===d.daily?'오늘의 사고실험':'수신된 탐구 질문'} · ${safe(q.category)} · Lv.${q.level}</span><button type="button" class="secondary" id="th-bookmark">${q.bookmarked?'★ 저장됨':'☆ 질문 보관'}</button></div><h3>${safe(q.question)}</h3><p class="notice">답변은 자유롭게 작성할 수 있으며, 정답이나 분량 기준은 없습니다.</p><form id="th-answer-form"><label for="th-answer">${q.answers.length?'현재의 생각을 새로 남기기':'나의 사유'}</label><textarea id="th-answer" required maxlength="30000" placeholder="당신의 생각을 자유롭게 기록하세요."></textarea><button type="submit" class="primary">${q.answers.length?'새로운 관점 저장':'답변 저장'}</button></form>${q.answers.length?`<details class="v5-inner"><summary>이 질문에 남긴 답변 · ${q.answers.length}편 (변천사)</summary>${q.answers.map((a,i)=>`<article class="v5-answer"><span class="notice">${i+1}번째 사유 · ${voyKey(a.at)}</span><p>${safe(a.text)}</p></article>`).join('')}</details>`:''}</div>`:`<div class="v5-inner"><p>새로운 질문을 선택하거나 과거에 받은 질문을 다시 탐구할 수 있습니다.</p></div>`;el.innerHTML=`<div class="v5-head"><div><p class="eyebrow">THOUGHT OBSERVATORY</p><h2>사유의 관측소</h2><p>질문을 따라 탐구의 범위를 넓혀 갑니다.</p></div><div class="v5-orb thought-orb" aria-hidden="true">✦</div></div><div class="v5-inner"><div class="v5-row"><div><p class="eyebrow">EXPLORATION LEVEL</p><h3>Lv.${lv} ${TH_NAMES[lv-1]}</h3><p>${TH_DESCS[lv-1]}</p></div><strong class="v5-count">${d.answered}<small>개 답변</small></strong></div>${target?`<div class="v5-track"><b style="width:${progress}%"></b></div><p class="notice">다음 단계까지 ${target-d.answered}개의 서로 다른 질문에 답변</p>`:'<p class="notice">현재 마지막 탐구 단계입니다. 새 질문 묶음으로 확장할 수 있습니다.</p>'}<p class="notice">현재 단계에서 아직 받지 않은 질문 ${d.remaining}개 · 답변하지 않아도 불이익 없음</p></div><div class="v5-row v5-question-controls"><button type="button" class="secondary" id="th-daily" ${!daily?'disabled':''}>오늘의 질문</button><button type="button" class="secondary" id="th-extra" ${!d.remaining?'disabled':''}>✦ 새로운 질문 수신</button></div>${!d.remaining?'<p class="notice">이 단계의 미수신 질문을 모두 만났습니다. 보관소의 미답변 질문을 탐구하거나 다음 질문 묶음을 추가할 수 있습니다. 자동 반복은 하지 않습니다.</p>':''}${questionHTML}<div class="v5-inner"><div class="v5-row"><h3>사유의 신호 보관소</h3><select id="th-filter" aria-label="질문 보관소 필터">${[['all','모든 질문'],['open','미해결 질문'],['answered','답변한 질문'],['saved','보관한 질문']].map(([k,v])=>`<option value="${k}" ${thFilter===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="v5-history">${hist.length?hist.map(x=>`<button type="button" class="secondary v5-history-item" data-th-pick="${x.id}"><small>Lv.${x.level} · ${safe(x.category)} · ${x.bookmarked?'★ ':''}${x.answers.length?'답변 '+x.answers.length+'편':'미해결'}</small><span>${safe(x.question)}</span></button>`).join(''):'<p class="notice">아직 해당하는 질문이 없습니다.</p>'}</div></div><div class="v5-inner"><p class="eyebrow">TIME CAPSULE</p><h3>사유의 타임캡슐</h3><p class="notice">지금의 생각을 미래의 나에게 남겨보세요. 지정한 날짜가 되면 이곳에서 열 수 있습니다.</p><details><summary>새 타임캡슐 만들기</summary><form id="th-capsule-form"><label for="th-cap-title">제목</label><input id="th-cap-title" maxlength="200" required><label for="th-cap-body">내용</label><textarea id="th-cap-body" maxlength="30000" required></textarea><label for="th-cap-date">개봉 날짜</label><input id="th-cap-date" type="date" min="${voyShift(d.today,1)}" required value="${voyShift(d.today,30)}"><button type="submit" class="primary">타임캡슐 봉인</button></form></details>${d.capsules.map(c=>`<article class="v5-capsule"><div class="v5-row"><strong>${safe(c.title)}</strong><button type="button" class="secondary" data-th-delete="${safe(c.id)}">삭제</button></div><p class="notice">${c.open_on} · ${c.body===null?'개봉 대기 중':'개봉 가능'}</p>${c.body===null?'':`<details><summary>캡슐 열기</summary><p class="v5-preserve">${safe(c.body)}</p></details>`}</article>`).join('')}</div><p class="notice">질문 답변과 타임캡슐은 개인 공간에 별도로 저장되며 지식의 우주에는 편입되지 않습니다.</p>`;
const pick=id=>{if(thAllowLeave()){thSelected=id;thRender()}};el.querySelector('#th-daily').onclick=()=>pick(d.daily);el.querySelector('#th-extra').onclick=()=>{if(thAllowLeave())thAction('lab_t_state',{p_issue:false,p_extra:true},v=>{if(v.chosen)thSelected=v.chosen;else notify('이 단계의 새 질문을 모두 받았습니다.')})};el.querySelector('#th-filter').onchange=e=>{if(thAllowLeave()){thFilter=e.target.value;thRender()}else e.target.value=thFilter};el.querySelectorAll('[data-th-pick]').forEach(b=>b.onclick=()=>pick(Number(b.dataset.thPick)));el.querySelector('#th-bookmark')?.addEventListener('click',()=>{if(thAllowLeave())thAction('lab_t_bookmark',{p_id:q.id,p_bookmarked:!q.bookmarked})});const f=el.querySelector('#th-answer-form');if(f){f.oninput=()=>editDirty=true;f.onsubmit=e=>{e.preventDefault();const a=el.querySelector('#th-answer').value.trim();if((el.querySelector('#th-cap-title').value.trim()||el.querySelector('#th-cap-body').value.trim())&&!confirm('작성 중인 타임캡슐을 지우고 답변을 저장할까요?'))return;if(a)thAction('lab_t_answer',{p_id:q.id,p_answer:a},()=>editDirty=false)}}const cap=el.querySelector('#th-capsule-form');cap.oninput=()=>editDirty=true;cap.onsubmit=e=>{e.preventDefault();if(el.querySelector('#th-answer')?.value.trim()&&!confirm('작성 중인 답변을 지우고 타임캡슐을 저장할까요?'))return;thAction('lab_t_capsule',{p_title:el.querySelector('#th-cap-title').value.trim(),p_body:el.querySelector('#th-cap-body').value.trim(),p_open:el.querySelector('#th-cap-date').value},()=>editDirty=false)};el.querySelectorAll('[data-th-delete]').forEach(b=>b.onclick=()=>{if(thAllowLeave()&&confirm('이 타임캡슐을 삭제할까요?'))thAction('lab_t_delete_capsule',{p_id:b.dataset.thDelete})});}

init();
</script>
<script src="growth.js?v=1"></script>
</body></html>
