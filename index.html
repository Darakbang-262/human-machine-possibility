/* Cloud storage observatory */
.storage-trigger{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-color:#344d68;background:#14243a;color:#dce8f7;white-space:nowrap}
.storage-trigger>span:first-child{font-size:15px;color:#a9d8e7}
.storage-trigger .storage-percent{font-size:11px;color:#efc58e;font-variant-numeric:tabular-nums}
.storage-trigger:disabled{opacity:.7}
.storage-dialog{width:min(580px,calc(100vw - 28px));max-width:580px;max-height:calc(100dvh - 28px);overflow:auto;padding:0;border:1px solid #344b69;border-radius:18px;background:linear-gradient(165deg,#111f34,#0b1423 72%);color:var(--text);box-shadow:0 28px 90px #000b}
.storage-dialog::backdrop{background:#030711d9;backdrop-filter:blur(5px)}
.storage-dialog-inner{padding:clamp(18px,4vw,28px)}
.storage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px}
.storage-head h2{font-size:25px;line-height:1.3;letter-spacing:-.045em;margin:0 0 5px}
.storage-head p:not(.eyebrow){font-size:12px;color:var(--muted);margin:0}
.storage-head .eyebrow{margin-bottom:7px;color:#a9d8e7}
.storage-total{padding:19px;border:1px solid #2c405d;border-radius:14px;background:linear-gradient(135deg,#162840,#101b2e);margin-bottom:14px}
.storage-total-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.storage-total-line span{font-size:12px;color:var(--muted)}
.storage-total-line strong{font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.storage-total-line small{font-size:13px;color:var(--muted);font-weight:400}
.storage-bar{height:11px;border-radius:999px;background:#26364e;overflow:hidden;margin:14px 0 9px}
.storage-bar span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#73c7e0,#a9d8e7 58%,#efc58e);transition:width .25s ease}
.storage-bar span.warning{background:linear-gradient(90deg,#e8b66e,#e78e75)}
.storage-total-foot{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}
.storage-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.storage-stat{min-width:0;padding:14px;border:1px solid #293b55;border-radius:12px;background:#111d30}
.storage-stat span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.storage-stat strong{display:block;font-size:17px;font-weight:600;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.storage-filecount{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-top:1px solid #26374f;border-bottom:1px solid #26374f;font-size:12px;color:var(--muted)}
.storage-alert{margin:14px 0;padding:11px 13px;border:1px solid #72553a;border-radius:10px;background:#302619;color:#f0d4a8;font-size:12px;line-height:1.6}
.storage-alert.critical{border-color:#78464a;background:#321d25;color:#f2b8b5}
.storage-note{font-size:11px;line-height:1.75;color:#9baec8;margin:14px 0 0}
.storage-error{padding:15px;border:1px solid #70464b;border-radius:11px;background:#2c1d28;color:#efc1c0;font-size:13px;line-height:1.7;margin:14px 0}
.storage-loading{padding:25px 12px;text-align:center;color:var(--muted);font-size:13px}
.storage-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:17px}
@media(max-width:650px){.storage-trigger{gap:4px;padding:4px 7px}.storage-trigger .storage-label{display:none}.storage-trigger .storage-percent{font-size:10px}.storage-stats{grid-template-columns:1fr 1fr}.storage-head h2{font-size:22px}.storage-total{padding:15px}.storage-total-line strong{font-size:23px}}

function cleanImages(raw){if(raw==null)return [];if(!Array.isArray(raw)||raw.length>MAX_FILES)throw Error('첨부 형식 오류');return raw.map(x=>{if(!x||typeof x.name!=='string'||typeof x.data!=='string'||!/^data:image\/(png|jpeg|gif|webp|bmp|avif);base64,[A-Za-z0-9+/]+={0,2}$/i.test(x.data)||x.data.length>Math.ceil(MAX_BYTES/3)*4+100)throw Error('지원하지 않는 이미지');const item={name:x.name.slice(0,255),data:x.data};if(Number.isFinite(x.sourceSize)&&x.sourceSize>0&&x.sourceSize<=MAX_BYTES)item.sourceSize=Math.floor(x.sourceSize);return item})}
function clean(raw){if(!Array.isArray(raw))throw Error('올바른 연구 자료 목록이 아닙니다.');const ids=new Set();return raw.map(e=>{if(!e||typeof e!=='object'||typeof e.title!=='string'||!e.title.trim()||typeof e.body!=='string'||!sections.some(s=>s.id===e.section))throw Error('기록 형식이 올바르지 않습니다.');let id=typeof e.id==='string'&&e.id?e.id:uid();if(ids.has(id))id=uid();ids.add(id);let validDate=v=>typeof v==='string'&&!isNaN(Date.parse(v))?v:new Date().toISOString();return{id,section:e.section,title:e.title,body:e.body,tags:typeof e.tags==='string'?e.tags:'',reference:typeof e.reference==='string'?e.reference:'',status:e.status==='완료'?'완료':e.status==='탐구 중'?'탐구 중':'미완성',created:validDate(e.created),updated:validDate(e.updated),images:cleanImages(e.images),visibility:e.visibility==='public'?'public':'private'}})}
function uid(){return globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(KEY+'-images',1);r.onupgradeneeded=()=>r.result.createObjectStore('records');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('저장소가 다른 창에서 사용 중입니다.'))})}
function dbRead(){return new Promise((resolve,reject)=>{let t=db.transaction('records','readonly'),r=t.objectStore('records').get('entries');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbWrite(next){return new Promise((resolve,reject)=>{let t=db.transaction('records','readwrite');t.objectStore('records').put(next,'entries');t.oncomplete=()=>resolve();t.onabort=t.onerror=()=>reject(t.error)})}
async function localInit(){try{db=await openDB()}catch{db=null}try{let raw=db?await dbRead():undefined;if(raw===undefined){let old=localStorage.getItem(KEY);raw=old?JSON.parse(old):[];entries=clean(raw);if(db)await dbWrite(entries)}else entries=clean(raw)}catch{storageOK=false}go('home');if(!storageOK)notify('기존 자료를 읽지 못했습니다. 원본을 보존하고 백업을 확인하세요.');else if(!db)notify('확장 저장소를 사용할 수 없어 저장 용량이 제한됩니다.')}
async function localPersist(next){if(!storageOK){notify('기존 저장소를 읽지 못해 덮어쓰기를 중단했습니다.');return false}try{if(db)await dbWrite(next);else localStorage.setItem(KEY,JSON.stringify(next));entries=next;return true}catch(e){notify('저장하지 못했습니다. 저장 공간 또는 권한을 확인하고 이미지 수를 줄여 다시 시도하세요.');return false}}
function fileData(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
function dataUrlBytes(data){const i=String(data||'').indexOf(',');if(i<0)return 0;const b=String(data).slice(i+1);return Math.max(0,Math.floor(b.length*3/4)-(b.endsWith('==')?2:b.endsWith('=')?1:0))}
async function optimizeStudyImage(file){const original=await fileData(file);if(!['image/jpeg','image/png'].includes(file.type)||file.size<700*1024)return {data:original,optimized:false};try{const img=new Image();img.src=original;await img.decode();if(!img.naturalWidth||!img.naturalHeight)return {data:original,optimized:false};const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;const ctx=canvas.getContext('2d',{alpha:file.type==='image/png'});if(!ctx)return {data:original,optimized:false};if(file.type==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}ctx.drawImage(img,0,0);const blob=await new Promise(resolve=>canvas.toBlob(resolve,file.type,file.type==='image/jpeg'?0.96:undefined));if(!blob||blob.size>file.size*0.95)return {data:original,optimized:false};return {data:await fileData(blob),optimized:true}}catch(error){console.warn('이미지 최적화를 건너뜁니다:',error);return {data:original,optimized:false}}}
function showImage(data){const d=document.createElement('dialog');d.className='image-viewer';const close=document.createElement('button');close.type='button';close.className='secondary';close.textContent='닫기';close.onclick=()=>d.close();const img=new Image();img.src=data;img.alt='첨부 이미지 확대';d.append(close,img);d.addEventListener('close',()=>d.remove());document.body.append(d);d.showModal()}

function editor(sectionId,id){if(busy||!owner)return;let e=id?entries.find(x=>x.id===id):null;if(id&&!e)return;current='edit';editDirty=false;let images=[...(e?.images||[])],pending=false;markNav();app.innerHTML=`<div class="pagehead"><p class="eyebrow">LAB NOTE</p><h1>${e?'연구 기록 수정':'새로운 연구 기록'}</h1><p>정답이 아닌 질문에서 출발해도 좋습니다.</p></div><form id="editor" class="formpanel"><div class="formgrid"><div class="formrow"><label for="cat">연구 공간</label><select id="cat">${sections.map(s=>`<option value="${s.id}" ${(e?.section||sectionId)===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div><div class="formrow"><label for="stat">진행 상태</label><select id="stat">${['미완성','탐구 중','완료'].map(s=>`<option ${(e?.status||'미완성')===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="formrow"><label for="visibility">공개 범위</label><select id="visibility"><option value="private" ${e?.visibility!=='public'?'selected':''}>비공개 — 나만 열람</option><option value="public" ${e?.visibility==='public'?'selected':''}>공개 — 누구나 열람</option></select><p class="notice">공개를 선택하면 클라우드 연결 후 방문자에게 글과 첨부 사진이 공개됩니다.</p></div><div class="formrow"><label for="title">제목 (필수)</label><input id="title" required maxlength="300" value="${safe(e?.title)}" placeholder="어떤 질문을 탐구하고 있나요?"></div><div class="formrow"><label for="body">내용</label><textarea id="body" placeholder="질문 / 이해한 내용 / 실험 결과 / 다음 탐구 방향 등 자유롭게 작성하세요.">${safe(e?.body)}</textarea></div><div class="formrow"><label for="images">그림 및 사진 첨부</label><div class="attach-picker"><input id="images" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,image/avif" multiple><p class="notice">PNG, JPG, GIF, WebP, BMP, AVIF · 한 장 최대 12MB · 기록당 20장<br>문서·필기 우선 최적화: 해상도는 줄이지 않습니다. JPEG는 고화질 96%로, PNG는 무손실 재저장 결과가 5% 이상 작을 때만 최적화합니다. GIF·WebP·BMP·AVIF는 원본을 유지합니다.</p></div><div id="image-previews" class="attach-grid"></div><p id="image-note" class="notice" aria-live="polite"></p></div><div class="formrow"><label for="tags">태그 (쉼표로 구분)</label><input id="tags" value="${safe(e?.tags)}" placeholder="뇌-컴퓨터 인터페이스, 인공지능, 회로이론"></div><div class="formrow"><label for="ref">참고 자료 (링크 또는 서지 정보)</label><input id="ref" value="${safe(e?.reference)}" placeholder="논문 주소 또는 참고 문헌"></div><p class="notice">기록과 첨부 사진은 로그인한 연구실 계정에 저장됩니다. 공개 여부를 확인하세요.</p><div class="actions"><button type="button" class="secondary" data-go="${e?.section||lastList}">취소</button><button type="submit" class="primary">기록 저장</button></div></form>`;let form=document.getElementById('editor');kuEditor(e);const picker=document.getElementById('images'), previews=document.getElementById('image-previews'), note=document.getElementById('image-note'), submit=form.querySelector('[type=submit]');function preview(){previews.innerHTML=images.map((im,i)=>{const stored=dataUrlBytes(im.data),source=Number.isFinite(im.sourceSize)?im.sourceSize:stored,detail=source>stored+1024?`${formatStorageBytes(source)} → ${formatStorageBytes(stored)} · ${Math.round((1-stored/source)*100)}% 절약`: `${formatStorageBytes(stored)} · ${im.sourceSize?'원본 유지':'저장된 파일'}`;return `<div class="attach-card"><img src="${safe(im.data)}" alt="${safe(im.name)}"><div class="attach-name">${safe(im.name)}<small>${safe(detail)}</small></div><button type="button" class="secondary" data-remove-image="${i}">첨부 제거</button></div>`}).join('');const saved=images.reduce((n,im)=>n+(Number.isFinite(im.sourceSize)?Math.max(0,im.sourceSize-dataUrlBytes(im.data)):0),0);note.textContent=images.length+'장 첨부됨'+(saved>1024?' · 약 '+formatStorageBytes(saved)+' 절약':'')+' · 원본 해상도 유지';}preview();previews.addEventListener('click',ev=>{let b=ev.target.closest('[data-remove-image]');if(!b||pending||busy)return;images.splice(Number(b.dataset.removeImage),1);editDirty=true;preview()});picker.addEventListener('change',async()=>{if(pending||busy)return;const files=Array.from(picker.files);picker.value='';pending=true;busy=true;submit.disabled=true;picker.disabled=true;let errors=[];try{for(const file of files){if async function init(){const cfg=window.LAB_CONFIG;if(!cfg||!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(cfg.url)||!cfg.key||cfg.key.startsWith('YOUR_')||!window.supabase){app.innerHTML='<div class="formpanel"><h1>연구실 연결 준비 중</h1><p>Supabase 프로젝트와 공개용 키를 config.js에 설정한 후 다시 열어 주세요. 지금은 인터넷 저장이 연결되어 있지 않습니다.</p></div>';setMode('서버 미설정');return}try{client=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});await setupSession()}catch(e){console.error(e);setMode('연결 실패');app.textContent='연구실 연결에 실패했습니다. 프로젝트 설정을 확인하세요.'}}
async function saveRecord(e,old){const attachments=[],uploaded=[];let saved=false;try{for(const im of e.images){let previous=old?.images?.find(i=>i.data===im.data&&i.path);let path=previous?.path;const mime=im.data.slice(5,im.data.indexOf(';'));if(!path){path=accountUser.id+'/'+crypto.randomUUID();const blob=await (await fetch(im.data)).blob();err(await client.storage.from(BUCKET).upload(path,blob,{contentType:mime,upsert:false,cacheControl:'0'}));uploaded.push(path)}attachments.push({name:im.name,path,mime})}const {images,visibility,id,updated,...payload}=e;const row={id,visibility:visibility==='public'?'public':'private',payload,attachments,updated_at:new Date().toISOString()};let result=old?err(await client.from('lab_records').update(row).eq('id',id).eq('updated_at',old.updated).select('id,updated_at')):err(await client.from('lab_records').insert(row).select('id,updated_at'));if(result.length!==1)throw Error('다른 기기에서 수정되었거나 삭제된 기록입니다.');saved=true;e.updated=result[0].updated_at;e.images.forEach((im,i)=>im.path=attachments[i].path);const paths=old?.images?.map(i=>i.path).filter(path=>path&&!attachments.some(a=>a.path===path))||[];if(paths.length)await client.storage.from(BUCKET).remove(paths);return e}catch(error){if(!saved&&uploaded.length)await client.storage.from(BUCKET).remove(uploaded);throw error}}
async function persist(next){if(!owner||!accountUser)return false;try{const old=new Map(entries.map(e=>[e.id,e]));for(const e of next){const prev=old.get(e.id);if(!prev||JSON.stringify(prev)!==JSON.stringify(e))await saveRecord(e,prev);old.delete(e.id)}for(const e of old.values()){const result=err(await client.from('lab_records').delete().eq('id',e.id).eq('updated_at',e.updated).select('id'));if(result.length!==1)throw Error('다른 기기에서 수정된 기록입니다.');const paths=e.images.map(im=>im.path).filter(Boolean);if(paths.length)await client.storage.from(BUCKET).remove(paths)}entries=next;await kuLoad();await refreshStorageUsage();setMode('클라우드 저장됨');return true}catch(e){console.error(e);notify('저장 실패 또는 일부 기록만 저장되었습니다. 다른 기기에서 수정했거나 저장 한도에 도달했을 수 있습니다. 작성 내용을 복사한 후 새로고침해 확인하세요.');return false}}

let ku11Pulse=new Set(),ku11Previous=null,ku11Group=null,ku11Observe=false;
const ku11Core=new Image();ku11Core.onload=()=>ku10Revision++;ku11Core.src=KU11_CORE;
function ku11Level(){const e=document.getElementById('resonance-level');if(!e)return;let level=kuData?kuData.bodies.filter(kuBirth).length:null;e.textContent=level===null?'Lv. —':`Lv. ${level}`;e.title=owner?'탄생하여 공명에 연결된 전체 천체 수':'공개 관측 가능한 천체 수';}

const ku10Images=KU10_ASSETS.icons.map(src=>{const im=new Image();im.onload=()=>ku10Revision++;im.src=src;return im});
function ku10Icon(b){if(Number.isInteger(b?.emblem)&&b.emblem>=1&&b.emblem<=15)return b.emblem-1;const k={star:9,planet:0,ring:5,moon:11,companion:7};return k[b?.kind]??0;}
function ku10Picker(b,kind){let value=ku10Icon(b||{kind})+1;return `<label>상징 문양 · 자유 선택</label><input type="hidden" name="emblem" value="${value}"><div class="ku10-picker" role="group" aria-label="상징 문양 선택">${KU10_NAMES.map((n,i)=>`<button type="button" data-ku-emblem="${i+1}" aria-pressed="${i+1===value}" class="${i+1===value?'chosen':''}"><img src="${KU10_ASSETS.icons[i]}" alt=""><span>${String(i+1).padStart(2,'0')} · ${n}</span></button>`).join('')}</div><p>문양은 천체 유형·성장 조건과 무관합니다. 기존 색상은 관측 표시점에 유지됩니다.</p>`;}
const KU_NAMES=['기초 탐사 은하','구조 형성 은하','지식 융합 은하','심층 탐구 은하','창조 연구 은하','가능성의 은하'];
const KU_KINDS={star:'항성',planet:'행성',ring:'고리 행성',moon:'위성',companion:'동반성'};
const KU_ELIGIBLE=new Set(['research','papers','knowledge','experiments','thoughts','journal']);
let kuScene={bodies:[],stats:new Map(),edges:[]};
let kuData=null,kuError='',kuGalaxy=1,kuSelected=null,kuDialog=null,kuFrame=0,kuZoom=1,kuPanX=0,kuPanY=0;
const kuEl=id=>document.getElementById(id);
const kuMembers=id=>(kuData?.members||[]).filter(m=>m.body_id===id);
const kuCount=id=>kuMembers(id).length;
const kuBody=id=>kuData?.bodies.find(b=>b.id===id);
const kuGalCount=g=>(kuData?.bodies||[]).filter(b=>b.galaxy===g).reduce((n,b)=>n+kuCount(b.id),0);
const kuRecords=id=>kuMembers(id).map(m=>entries.find(e=>e.id===m.record_id)).filter(Boolean);
const kuTags=id=>new Set(kuRecords(id).flatMap(r=>r.tags.split(',').map(t=>t.trim().normalize('NFKC').toLowerCase()).filter(Boolean)));
function kuAutomatic(a,b){let tags=kuTags(a.id);return [...kuTags(b.id)].some(t=>tags.has(t));}
function kuLink(a,b){return (kuData?.links||[]).find(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a));}
function kuBirth(b){return kuCount(b.id)>=b.birth;}
function kuVisible(){return (kuData?.bodies||[]).filter(b=>!owner||b.galaxy===kuGalaxy);}

function kuMount(){cancelAnimationFrame(kuFrame);ku12BindFull();if(!kuData||!kuEl('ku-canvas'))return;kuEl('ku-create')?.addEventListener('click',()=>kuBodyDialog());kuEl('ku-plus').onclick=()=>kuZoom=Math.min(3,kuZoom*1.22);kuEl('ku-minus').onclick=()=>kuZoom=Math.max(.5,kuZoom/1.22);kuEl('ku-center').onclick=()=>{kuZoom=1;kuPanX=kuPanY=0};kuEl('ku11-list').onclick=()=>ku11List();kuEl('ku11-groups')?.addEventListener('click',ku11Groups);kuEl('ku11-view').onclick=()=>ku11SetView(true);kuEl('ku11-exit').onclick=()=>ku11SetView(false);kuEl('ku12-fragments')?.addEventListener('click',ku12Fragments);kuEl('ku12-formation')?.addEventListener('click',ku12Formation);kuEl('ku12-constellations')?.addEventListener('click',ku11Groups);kuEl('ku12-report')?.addEventListener('click',ku12Report);kuRender();ku11SetView(ku11Observe);kuDrawStart();}
function kuRender(){if(!kuEl('ku-side')||!kuData)return;let all=kuVisible();kuBuildScene(all);let n=all.find(b=>b.id===kuSelected);kuSelected=n?.id||null;let gs=kuEl('ku-galaxies');gs.hidden=!owner;gs.innerHTML=owner?KU_NAMES.map((name,i)=>`<button data-ku12-gal="${i+1}" class="${kuGalaxy===i+1?'active':''}" ${i+1>kuData.unlocked?'disabled':''}>${String(i+1).padStart(2,'0')} · ${name}<small>${i+1>kuData.unlocked?'미개척':kuGalCount(i+1)+' / 150'}</small></button>`).join(''):'';gs.querySelectorAll('[data-ku12-gal]').forEach(btn=>btn.onclick=()=>{kuGalaxy=+btn.dataset.ku12Gal;kuSelected=null;ku11Group=null;kuZoom=1;kuPanX=kuPanY=0;kuRender()});ku12Dock();let total=owner?kuGalCount(kuGalaxy):kuData.members.length;kuEl('ku-progress').innerHTML=owner?`<span>${total} / 150 자료</span><div class="ku-track"><i style="width:${Math.min(100,total/150*100)}%"></i></div>`:`<span>공개 관측 · ${all.length}개 천체</span>`;let side=kuEl('ku-side');side.hidden=!n||ku11Observe;if(!n){side.innerHTML='';return;}

ku12DetailTabs(side,n);kuEl('ku11-close').onclick=()=>{kuSelected=null;kuRender()};side.querySelectorAll('[data-ku-jump]').forEach(el=>el.onclick=()=>{const b=kuBody(el.dataset.kuJump);if(b){kuGalaxy=b.galaxy;kuSelected=b.id;kuZoom=1;kuPanX=kuPanY=0;kuRender()}});kuEl('ku-pick').onchange=e=>{kuSelected=e.target.value;kuRender()};side.querySelectorAll('[data-ku-read]').forEach(b=>b.onclick=()=>{lastList=current==='universe'?'universe':'home';read(b.dataset.kuRead)});kuEl('ku-edit')?.addEventListener('click',()=>kuBodyDialog(n));kuEl('ku-assign')?.addEventListener('click',()=>kuAssignDialog(n));kuEl('ku-evolve')?.addEventListener('click',()=>kuEvolution(n));kuEl('ku-link-add')?.addEventListener('click',()=>kuMutate('lab_u_link',{p_a:n.id,p_b:kuEl('ku-link-target').value,p_mode:kuEl('ku-link-public').checked?'public':'private'}));kuEl('ku-link-remove')?.addEventListener('click',()=>kuMutate('lab_u_link',{p_a:n.id,p_b:kuEl('ku-link-target').value,p_mode:'remove'}));}
function ku11SetView(on){ku11Observe=on;let root=kuEl('ku-root');if(!root)return;root.classList.toggle('ku11-observe',on);kuEl('ku11-exit').hidden=!on;kuEl('ku-side').hidden=on||!kuSelected;root.querySelector('.ku11-menu')?.removeAttribute('open');ku12FullUI();}
function ku11List(){kuEl('ku-root')?.querySelector('.ku11-menu')?.removeAttribute('open');const d=document.createElement('dialog');d.className='ku-dialog ku11-list-dialog';d.innerHTML=`<h2>천체 목록</h2>${owner?`<p>미편입 지식 파편 ${entries.filter(r=>KU_ELIGIBLE.has(r.section)&&!kuData.members.some(m=>m.record_id===r.id)).length}개 · 자료 편입으로 천체에 연결할 수 있습니다.</p>`:''}<div class="ku-list">${kuVisible().map(b=>`<button data-id="${safe(b.id)}">${safe(b.title)}<small>${kuCount(b.id)} / ${b.capacity}</small></button>`).join('')||'<p>아직 천체가 없습니다.</p>'}</div><div class="ku-row"><button data-close>닫기</button></div>`;document.body.append(d);d.onclose=()=>d.remove();d.querySelector('[data-close]').onclick=()=>d.close();d.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{kuSelected=x.dataset.id;ku11Observe=false;kuRender();d.close()});d.showModal();}

function ku12Fragments(){if(!owner)return;let free=ku12Free(),targets=kuVisible().filter(b=>!b.sealed&&kuCount(b.id)<b.capacity);let d=kuOpen(`<h2>지식 파편 · 기록 배정</h2><p>아직 천체에 편입되지 않은 기록 ${free.length}개. 기록 하나는 파편 하나이며 중복 소비하지 않습니다.</p><form><label>대상 천체</label><select name="target">${targets.map(b=>`<option value="${safe(b.id)}">${safe(b.title)} · ${kuCount(b.id)}/${b.capacity}</option>`).join('')}</select><div class="ku12-rows">${free.map(r=>`<label><input type="checkbox" name="rec" value="${safe(r.id)}"><span>${safe(r.title)}<small>${safe(getSection(r.section).name)}</small></span></label>`).join('')||'<p>미편입 기록이 없습니다.</p>'}</div><p class="ku-error"></p><div class="ku-row"><button class="ku-primary" ${!targets.length||!free.length?'disabled':''}>선택 파편 편입</button><button type="button" id="ku12-new">새 천체</button><button type="button" data-ku-close>닫기</button></div></form>`);if(!d)return;d.querySelector('#ku12-new').onclick=()=>{d.close();kuBodyDialog()};d.querySelector('form').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,ids=[...f.querySelectorAll('input:checked')].map(x=>x.value),id=f.elements.target.value,b=kuBody(id),msg=d.querySelector('.ku-error');if(!ids.length||!b)return void(msg.textContent='기록과 천체를 선택하세요.');if(ids.length>Math.min(b.capacity-kuCount(id),150-kuGalCount(b.galaxy)))return void(msg.textContent='남은 수용량을 초과했습니다.');if(busy)return;busy=true;let done=0;try{for(let r of ids){err(await client.rpc('lab_u_assign',{p_record:r,p_body:id}));done++}await kuLoad();kuSelected=id;d.close();kuRender();notify(done+'개 파편을 편입했습니다.')}catch(ex){await kuLoad();kuRender();msg.textContent=done+'개 편입 후 중단: '+(ex.message||'다시 확인하세요.');f.querySelector('button[type=submit],button.ku-primary').disabled=true;}finally{busy=false}};}

const TH_NAMES=['관찰자','탐구자','연결자','사상가'];
const TH_TARGETS=[10,25,45];
const TH_DESCS=['인간과 경험, 앎의 본질','의식과 과학, 기술의 원리','학문을 가로지르는 연결','문명과 존재, 새로운 가능성'];
const voyDate=d=>new Intl.DateTimeFormat('en-CA',{timeZone:VOY_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d));
function voyKey(d){const v=new Intl.DateTimeFormat('en-CA',{timeZone:VOY_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(d));const part=k=>v.find(p=>p.type===k).value;return `${part('year')}-${part('month')}-${part('day')}`;}
function voyShift(d,n){const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
const voyageStart='2026-11-25';
let voySelected=null,voyMonth=null,thData=null,thSelected=null,thRequest=0,thLoading=false,thFilter='all';
function thClear(){thRequest++;thData=null;thSelected=null;thLoading=false;thFilter='all';voySelected=null;voyMonth=null;}
function thShell(id){if(id==='journal')return owner?'<section id="voyage-panel" class="v5-panel"></section>':'<section class="v5-panel"><p class="eyebrow">VOYAGE LOG</p><h2>항해 기록실</h2><p class="notice">개인 항해 통계는 연구실 관리자에게만 표시됩니다.</p></section>';if(id==='thoughts')return owner?'<section id="thought-panel" class="v5-panel"><p class="notice">사유의 신호를 수신 중…</p></section>':'<section class="v5-panel"><p class="eyebrow">THOUGHT OBSERVATORY</p><h2>사유의 관측소</h2><p class="notice">개인 질문과 답변은 연구실 관리자에게만 표시됩니다.</p></section>';return '';}
function thMount(id){if(!owner)return;if(id==='journal')voyRender();if(id==='thoughts')thLoad();}
function voyRender(){const el=document.getElementById('voyage-panel');if(!el||!owner)return;const today=voyKey(Date.now());if(!voyMonth)voyMonth=today.slice(0,7);if(!voySelected)voySelected=today;const map=new Map();for(const e of entries){const k=voyKey(e.created);if(!map.has(k))map.set(k,[]);map.get(k).push(e);}const daily=map.get(today)||[],chosen=map.get(voySelected)||[],monthEntries=entries.filter(e=>voyKey(e.created).startsWith(voyMonth));let days=Math.max(1,Math.floor((Date.parse(today)-Date.parse(voyageStart))/86400000)+1);const first=voyMonth+'-01',firstDate=new Date(first+'T00:00:00Z'),start=voyShift(first,-firstDate.getUTCDay());const counts=Array.from({length:42},(_,i)=>{const k=voyShift(start,i),a=map.get(k)||[];return {k,n:a.length,inside:k.startsWith(voyMonth)}});let old=entries.filter(e=>e.section==='journal'&&voyKey(e.created)<=voyShift(today,-30)).sort((a,b)=>Math.abs(Date.parse(voyKey(a.created))-Date.parse(voyShift(today,-30)))-Math.abs(Date.parse(voyKey(b.created))-Date.parse(voyShift(today,-30))))[0];const categories=sections.map(s=>({name:s.name,n:monthEntries.filter(e=>e.section===s.id).length}));el.innerHTML=`<div class="v5-head"><div><p class="eyebrow">VOYAGE LOG · 항해 ${days}일차</p><h2>항해 기록실</h2><p>달성해야 할 양은 없습니다. 당신이 남긴 발자취만 기록합니다.</p></div><div class="v5-orb voyage-orb" aria-hidden="true">✧</div></div><div class="v5-stats">${[['설립 이후',days+'일'],['기록을 남긴 날',map.size+'일'],['전체 연구 기록',entries.length+'개'],['연구 일지',entries.filter(e=>e.section==='journal').length+'편']].map(([a,b])=>`<div><span>${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="v5-inner"><p class="eyebrow">DAILY REPORT · ${today}</p><h3>오늘의 항해 보고서</h3><p>${daily.length?`오늘 ${daily.length}개의 새 기록과 ${daily.reduce((n,e)=>n+(e.images?.length||0),0)}장의 첨부 사진이 쌓였습니다.`:'오늘 새로 작성된 기록은 없습니다. 쉬어가는 시간도 여정의 일부입니다.'}</p>${daily.length?listHTML(sorted(daily).slice(0,4)):''}</div><div class="v5-calendar"><div class="v5-row"><h3>연구 달력 · ${voyMonth}</h3><div><button type="button" class="secondary" id="voy-prev" aria-label="이전 달">‹</button> <button type="button" class="secondary" id="voy-next" aria-label="다음 달">›</button> <button type="button" class="secondary" id="voy-today">오늘</button></div></div><div class="v5-days">${['일','월','화','수','목','금','토'].map(x=>`<span>${x}</span>`).join('')}${counts.map(c=>`<button type="button" class="v5-day ${!c.inside?'out':''} ${c.k===voySelected?'selected':''}" data-voy-date="${c.k}" style="--heat:${Math.min(4,c.n)}" aria-label="${c.k} 기록 ${c.n}개" ${c.k>today?'disabled':''}>${Number(c.k.slice(-2))}<small>${c.n||'·'}</small></button>`).join('')}</div><p class="notice">색은 그날 생성된 기록의 수를 나타냅니다. 비어 있는 날은 미달성이 아닙니다.</p><div class="v5-inner"><h3>${voySelected} · ${chosen.length}개 기록</h3>${chosen.length?listHTML(sorted(chosen)):'<p class="notice">이 날짜에는 남겨진 기록이 없습니다.</p>'}</div></div><div class="v5-inner"><h3>${voyMonth} 월간 항해 보고서</h3><p>새 기록 ${monthEntries.length}개 · 기록한 날 ${[...map.keys()].filter(k=>k.startsWith(voyMonth)).length}일 · 첨부 ${monthEntries.reduce((n,e)=>n+(e.images?.length||0),0)}장</p><div class="v5-bars">${categories.map(c=>`<div><span>${c.name}</span><i><b style="width:${monthEntries.length?100*c.n/monthEntries.length:0}%"></b></i><span>${c.n}</span></div>`).join('')}</div></div><div class="v5-inner"><p class="eyebrow">A SIGNAL FROM THE PAST</p><h3>과거의 항해 기록</h3>${old?listHTML([old]):'<p class="notice">한 달이 지난 연구 일지가 생기면 이곳에서 다시 만날 수 있습니다.</p>'}</div><div class="v5-inner"><p class="eyebrow">REFLECTION</p><h3>오늘 새롭게 이해하게 된 것은 무엇인가요?</h3><p class="notice">원한다면 자유롭게 일지에 남겨 보세요.</p><button type="button" class="primary" data-new="journal">일지 작성하기</button></div>`;function shift(n){const d=new Date(voyMonth+'-01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+n);voyMonth=d.toISOString().slice(0,7);voySelected=voyMonth+'-01';voyRender();}el.querySelector('#voy-prev').onclick=()=>shift(-1);el.querySelector('#voy-next').onclick=()=>{if(voyMonth<today.slice(0,7))shift(1)};el.querySelector('#voy-next').disabled=voyMonth>=today.slice(0,7);el.querySelector('#voy-today').onclick=()=>{voySelected=today;voyMonth=today.slice(0,7);voyRender()};el.querySelectorAll('[data-voy-date]').forEach(b=>b.onclick=()=>{voySelected=b.dataset.voyDate;voyMonth=voySelected.slice(0,7);voyRender()});}
async function thLoad(){const el=document.getElementById('thought-panel');if(!el||!owner||!client)return;const request=++thRequest;try{const v=err(await client.rpc('lab_t_state',{p_issue:true,p_extra:false}));if(request!==thRequest||!owner||!el.isConnected)return;const changedDay=thData?.today!==v.today;thData=v;if(changedDay||!v.history.some(q=>q.id===thSelected))thSelected=v.daily||null;thRender()}catch(e){if(request!==thRequest||!el.isConnected)return;console.error('Thought observatory:',e);el.innerHTML='<h2>사유의 관측소</h2><p class="notice">질문 저장소 연결을 확인하세요. 기존 사유 기록은 계속 사용할 수 있습니다.</p><button type="button" class="secondary" id="th-retry">다시 불러오기</button>';el.querySelector('#th-retry').onclick=thLoad;}}
function thAllowLeave(){if(!editDirty)return true;if(!confirm('아직 저장하지 않은 사유를 지울까요?'))return false;editDirty=false;return true;}
async function thAction(fn,args,after){if(!owner||busy||thLoading||!thData)return;busy=true;thLoading=true;let before=thData.level;try{const v=err(await client.rpc(fn,args));thData=v;after?.(v);if(v.level>before)notify(`새로운 사유 단계 · Lv.${v.level} ${TH_NAMES[v.level-1]}`);else if(fn==='lab_t_answer')notify('사유 답변을 저장했습니다.');thRender()}catch(e){console.error(e);notify(e.message||'사유 정보를 저장하지 못했습니다.');}finally{busy=false;thLoading=false;}}
function thRender(){const el=document.getElementById('thought-panel');if(!el||!owner||!thData)return;const d=thData,lv=d.level,lower=[0,10,25,45][lv-1],target=TH_TARGETS[lv-1],q=d.history.find(x=>x.id===thSelected),daily=d.history.find(x=>x.id===d.daily),hist=d.history.filter(x=>thFilter==='all'||(thFilter==='saved'&&x.bookmarked)||(thFilter==='open'&&!x.answers.length)||(thFilter==='answered'&&x.answers.length));const progress=target?Math.min(100,Math.max(0,100*(d.answered-lower)/(target-lower))):100;const questionHTML=q?`<div class="v5-question"><div class="v5-row"><span class="eyebrow">${q.id===d.daily?'오늘의 사고실험':'수신된 탐구 질문'} · ${safe(q.category)} · Lv.${q.level}</span><button type="button" class="secondary" id="th-bookmark">${q.bookmarked?'★ 저장됨':'☆ 질문 보관'}</button></div><h3>${safe(q.question)}</h3><p class="notice">답변은 자유롭게 작성할 수 있으며, 정답이나 분량 기준은 없습니다.</p><form id="th-answer-form"><label for="th-answer">${q.answers.length?'현재의 생각을 새로 남기기':'나의 사유'}</label><textarea id="th-answer" required maxlength="30000" placeholder="당신의 생각을 자유롭게 기록하세요."></textarea><button type="submit" class="primary">${q.answers.length?'새로운 관점 저장':'답변 저장'}</button></form>${q.answers.length?`<details class="v5-inner"><summary>이 질문에 남긴 답변 · ${q.answers.length}편 (변천사)</summary>${q.answers.map((a,i)=>`<article class="v5-answer"><span class="notice">${i+1}번째 사유 · ${voyKey(a.at)}</span><p>${safe(a.text)}</p></article>`).join('')}</details>`:''}</div>`:`<div class="v5-inner"><p>새로운 질문을 선택하거나 과거에 받은 질문을 다시 탐구할 수 있습니다.</p></div>`;el.innerHTML=`<div class="v5-head"><div><p class="eyebrow">THOUGHT OBSERVATORY</p><h2>사유의 관측소</h2><p>질문을 따라 탐구의 범위를 넓혀 갑니다.</p></div><div class="v5-orb thought-orb" aria-hidden="true">✦</div></div><div class="v5-inner"><div class="v5-row"><div><p class="eyebrow">EXPLORATION LEVEL</p><h3>Lv.${lv} ${TH_NAMES[lv-1]}</h3><p>${TH_DESCS[lv-1]}</p></div><strong class="v5-count">${d.answered}<small>개 답변</small></strong></div>${target?`<div class="v5-track"><b style="width:${progress}%"></b></div><p class="notice">다음 단계까지 ${target-d.answered}개의 서로 다른 질문에 답변</p>`:'<p class="notice">현재 마지막 탐구 단계입니다. 새 질문 묶음으로 확장할 수 있습니다.</p>'}<p class="notice">현재 단계에서 아직 받지 않은 질문 ${d.remaining}개 · 답변하지 않아도 불이익 없음</p></div><div class="v5-row v5-question-controls"><button type="button" class="secondary" id="th-daily" ${!daily?'disabled':''}>오늘의 질문</button><button type="button" class="secondary" id="th-extra" ${!d.remaining?'disabled':''}>✦ 새로운 질문 수신</button></div>${!d.remaining?'<p class="notice">이 단계의 미수신 질문을 모두 만났습니다. 보관소의 미답변 질문을 탐구하거나 다음 질문 묶음을 추가할 수 있습니다. 자동 반복은 하지 않습니다.</p>':''}${questionHTML}<div class="v5-inner"><div class="v5-row"><h3>사유의 신호 보관소</h3><select id="th-filter" aria-label="질문 보관소 필터">${[['all','모든 질문'],['open','미해결 질문'],['answered','답변한 질문'],['saved','보관한 질문']].map(([k,v])=>`<option value="${k}" ${thFilter===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="v5-history">${hist.length?hist.map(x=>`<button type="button" class="secondary v5-history-item" data-th-pick="${x.id}"><small>Lv.${x.level} · ${safe(x.category)} · ${x.bookmarked?'★ ':''}${x.answers.length?'답변 '+x.answers.length+'편':'미해결'}</small><span>${safe(x.question)}</span></button>`).join(''):'<p class="notice">아직 해당하는 질문이 없습니다.</p>'}</div></div><div class="v5-inner"><p class="eyebrow">TIME CAPSULE</p><h3>사유의 타임캡슐</h3><p class="notice">지금의 생각을 미래의 나에게 남겨보세요. 지정한 날짜가 되면 이곳에서 열 수 있습니다.</p><details><summary>새 타임캡슐 만들기</summary><form id="th-capsule-form"><label for="th-cap-title">제목</label><input id="th-cap-title" maxlength="200" required><label for="th-cap-body">내용</label><textarea id="th-cap-body" maxlength="30000" required></textarea><label for="th-cap-date">개봉 날짜</label><input id="th-cap-date" type="date" min="${voyShift(d.today,1)}" required value="${voyShift(d.today,30)}"><button type="submit" class="primary">타임캡슐 봉인</button></form></details>${d.capsules.map(c=>`<article class="v5-capsule"><div class="v5-row"><strong>${safe(c.title)}</strong><button type="button" class="secondary" data-th-delete="${safe(c.id)}">삭제</button></div><p class="notice">${c.open_on} · ${c.body===null?'개봉 대기 중':'개봉 가능'}</p>${c.body===null?'':`<details><summary>캡슐 열기</summary><p class="v5-preserve">${safe(c.body)}</p></details>`}</article>`).join('')}</div><p class="notice">질문 답변과 타임캡슐은 개인 공간에 별도로 저장되며 지식의 우주에는 편입되지 않습니다.</p>`;
const pick=id=>{if(thAllowLeave()){thSelected=id;thRender()}};el.querySelector('#th-daily').onclick=()=>pick(d.daily);el.querySelector('#th-extra').onclick=()=>{if(thAllowLeave())thAction('lab_t_state',{p_issue:false,p_extra:true},v=>{if(v.chosen)thSelected=v.chosen;else notify('이 단계의 새 질문을 모두 받았습니다.')})};el.querySelector('#th-filter').onchange=e=>{if(thAllowLeave()){thFilter=e.target.value;thRender()}else e.target.value=thFilter};el.querySelectorAll('[data-th-pick]').forEach(b=>b.onclick=()=>pick(Number(b.dataset.thPick)));el.querySelector('#th-bookmark')?.addEventListener('click',()=>{if(thAllowLeave())thAction('lab_t_bookmark',{p_id:q.id,p_bookmarked:!q.bookmarked})});const f=el.querySelector('#th-answer-form');if(f){f.oninput=()=>editDirty=true;f.onsubmit=e=>{e.preventDefault();const a=el.querySelector('#th-answer').value.trim();if((el.querySelector('#th-cap-title').value.trim()||el.querySelector('#th-cap-body').value.trim())&&!confirm('작성 중인 타임캡슐을 지우고 답변을 저장할까요?'))return;if(a)thAction('lab_t_answer',{p_id:q.id,p_answer:a},()=>editDirty=false)}}const cap=el.querySelector('#th-capsule-form');cap.oninput=()=>editDirty=true;cap.onsubmit=e=>{e.preventDefault();if(el.querySelector('#th-answer')?.value.trim()&&!confirm('작성 중인 답변을 지우고 타임캡슐을 저장할까요?'))return;thAction('lab_t_capsule',{p_title:el.querySelector('#th-cap-title').value.trim(),p_body:el.querySelector('#th-cap-body').value.trim(),p_open:el.querySelector('#th-cap-date').value},()=>editDirty=false)};el.querySelectorAll('[data-th-delete]').forEach(b=>b.onclick=()=>{if(thAllowLeave()&&confirm('이 타임캡슐을 삭제할까요?'))thAction('lab_t_delete_capsule',{p_id:b.dataset.thDelete})});}

init();
</script>
